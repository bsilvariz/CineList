<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CineList - Catálogo de Filmes</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <!-- CSS simples usando CDN Bootstrap para layout limpo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light container py-4">

<h1 class="mb-4">🎬 CineList - Catálogo de Filmes</h1>

<!-- FORMULÁRIO DE CADASTRO / EDIÇÃO -->
<div class="card mb-4 shadow-sm">
    <div class="card-header bg-primary text-white">
        <h5 class="card-title mb-0" th:text="${filme.id == null ? 'Cadastrar Novo Filme' : 'Editar Filme'}">Cadastrar Filme</h5>
    </div>
    <div class="card-body">
        <form th:action="@{/filmes/save}" th:object="${filme}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Título:</label>
                    <input type="text" th:field="*{titulo}" class="form-control" required placeholder="Ex: De Volta para o Futuro">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Gênero:</label>
                    <input type="text" th:field="*{genero}" class="form-control" required placeholder="Ex: Ficção Científica">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Ano de Lançamento:</label>
                    <input type="number" th:field="*{anoLancamento}" class="form-control" required placeholder="Ex: 1985">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Diretor:</label>
                    <input type="text" th:field="*{diretor}" class="form-control" required placeholder="Ex: Robert Zemeckis">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Nota (1 a 5):</label>
                    <input type="number" min="1" max="5" th:field="*{nota}" class="form-control" required placeholder="5">
                </div>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-success">Salvar</button>
                <a th:href="@{/filmes/index}" class="btn btn-secondary">Limpar / Novo</a>
            </div>
        </form>
    </div>
</div>

<!-- TABELA DE FILMES -->
<div class="card shadow-sm">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Lista de Filmes</h5>
        <span class="badge bg-light text-dark" th:text="'Total: ' + ${totalFilmes}">Total: 0</span>
    </div>
    <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Gênero</th>
                <th>Ano</th>
                <th>Diretor</th>
                <th>Nota</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="f : ${filmes}">
                <td th:text="${f.id}">1</td>
                <td th:text="${f.titulo}">De Volta para o Futuro</td>
                <td th:text="${f.genero}">Ficção Científica</td>
                <td th:text="${f.anoLancamento}">1985</td>
                <td th:text="${f.diretor}">Robert Zemeckis</td>
                <td th:text="${f.nota} + ' ⭐'">5 ⭐</td>
                <td>
                    <a th:href="@{/filmes/edit/{id}(id=${f.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/filmes/delete/{id}(id=${f.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Excluir este filme?')">Excluir</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(filmes)}">
                <td colspan="7" class="text-center py-3">Nenhum filme cadastrado.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
